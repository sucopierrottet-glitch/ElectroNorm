name: Build and Release ElectroNorm Pro

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & App Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare APK File
        run: cp build/app/outputs/flutter-apk/app-release.apk electronorm.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: electronorm-apk
          path: electronorm.apk

      - name: Build App Bundle
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Publish GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.8
          name: "ElectroNorm Pro v1.2.8+11 (Mexico NOM-001 & USA NEC Profiles)"
          body: |
            ### ElectroNorm Pro v1.2.8+11 (Production Release)
            - Dual normative profile support: Mexico (NOM-001-SEDE) and USA (NEC / NFPA 70)
            - Dynamic locale & unit switching (metric vs imperial)
            - Grounding & bonding calculator with NOM-001 Art. 250 references
            - Conduit bending with cm/DN and in/" toggle
            - Compliant PDF reports with UVIE / AHJ sign-off
          files: |
            electronorm.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
